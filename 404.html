<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Dr. Vikram Jain</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Critical CSS inlined for faster rendering -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            background-color: #f9fafb;
            color: #1f2937;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #3b82f6;
            margin-bottom: 1rem;
        }
        .title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .message {
            font-size: 1.25rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to right, #3b82f6, #2563eb);
            color: white;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
    
    <!-- TailwindCSS - defer loading to improve performance -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    
    <!-- Optimized component loader -->
    <script src="/src/js/component-loader.js"></script>
    
    <!-- Simple navigation script -->
    <script src="/src/js/simple-navigation.js"></script>
</head>
<body>
    <!-- Navigation Component -->
    <div id="navbarComponent"></div>

    <div class="container mx-auto px-4 py-16 md:py-32">
        <div class="max-w-3xl mx-auto text-center">
            <div class="error-code">404</div>
            <h1 class="title text-3xl md:text-4xl font-bold mb-4">Page Not Found</h1>
            <p class="message text-gray-600 mb-8">The page you are looking for doesn't exist or has been moved.</p>
            <a href="/" class="btn">Return to Homepage</a>
        </div>
    </div>

    <!-- Footer Component -->
    <div id="footerComponent"></div>
</body>
</html>
