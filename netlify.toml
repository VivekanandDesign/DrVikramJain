[build]
publish = "/"
command = ""

# Removed the redirect that was sending all traffic to index.html
# [[redirects]]
# from = "/*"
# to = "/index.html"
# status = 200

# Custom 404 handling
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[build.processing]
skip_processing = false

[build.processing.html]
pretty_urls = true

[build.processing.css]
bundle = true
minify = true

[build.processing.js]
bundle = true
minify = true

[build.processing.images]
compress = true
