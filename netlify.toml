[build]
publish = "/"
command = ""

# Handle specific potential problem paths to ensure they go to the correct place
[[redirects]]
from = "/services"
to = "/pages/services.html"
status = 301
force = true

[[redirects]]
from = "/about"
to = "/pages/about.html"
status = 301
force = true

[[redirects]]
from = "/contact"
to = "/pages/contact.html"
status = 301
force = true

[[redirects]]
from = "/experience"
to = "/pages/experience.html" 
status = 301
force = true

# Custom 404 handling - ensuring it's loaded from the root path
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[build.processing]
skip_processing = false

[build.processing.html]
pretty_urls = true

[build.processing.css]
bundle = true
minify = true

[build.processing.js]
bundle = true
minify = true

[build.processing.images]
compress = true
