<!-- Direct mobile menu script and navigation fixes for better responsiveness -->
<script>
    (function() {
        // Initialize directly for this component
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const closeMobileMenu = document.getElementById('closeMobileMenu');
        const mobileMenu = document.getElementById('mobileMenu');
        
        // Detect current location with more robust path detection
        const pathname = window.location.pathname;
        // Check both /pages and pages in the path
        const inPagesDir = pathname.includes('/pages/') || pathname.endsWith('/pages') || 
                        pathname.includes('pages/') || pathname.match(/\/pages\/[^\/]+\.html$/);
        
        // Fix navigation links on page load
        fixNavigationLinks();
        
        // Menu toggle functionality
        if (mobileMenuButton && mobileMenu && closeMobileMenu) {
            // If we already set up the handlers, don't do it again
            if (mobileMenuButton.dataset.initialized === 'true') return;
            mobileMenuButton.dataset.initialized = 'true';
            
            // Body for preventing scroll
            const body = document.body;
            
            // Toggle menu function
            function toggleMenu(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                
                const isHidden = mobileMenu.classList.contains('hidden');
                
                if (isHidden) {
                    // Open menu
                    mobileMenu.classList.remove('hidden');
                    body.classList.add('overflow-hidden');
                    
                    // Force browser to recognize the element before applying transforms
                    mobileMenu.getBoundingClientRect();
                } else {
                    // Close menu
                    body.classList.remove('overflow-hidden');
                    mobileMenu.classList.add('hidden');
                }
            }
            
            // Add event listeners
            mobileMenuButton.addEventListener('click', toggleMenu);
            closeMobileMenu.addEventListener('click', toggleMenu);
            
            // Close on ESC key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
                    toggleMenu(e);
                }
            });
        }
        
        // Function to fix navigation links based on current location
        function fixNavigationLinks() {
            // Get all navigation links
            const navLinks = {
                home: [document.getElementById('homeLink'), document.getElementById('mobileHomeLink')],
                about: [document.getElementById('aboutLink'), document.getElementById('mobileAboutLink')],
                services: [document.getElementById('servicesLink'), document.getElementById('mobileServicesLink')],
                contact: [document.getElementById('contactLink'), document.getElementById('mobileContactLink')]
            };
            
            // More robust base path logic that handles all cases
            let basePath = '';
            let pagesPath = 'pages/';
            
            if (inPagesDir) {
                // If we're in the pages directory, we need to go up one level
                basePath = '../';
                pagesPath = '';
            }
            
            console.log('Current path:', pathname);
            console.log('Is in pages directory:', inPagesDir);
            console.log('Base path:', basePath);
            console.log('Pages path:', pagesPath);
            
            // Update home links
            navLinks.home.forEach(link => {
                if (link) {
                    link.setAttribute('href', `${basePath}index.html`);
                    console.log('Home link set to:', `${basePath}index.html`);
                }
            });
            
            // Update about links
            navLinks.about.forEach(link => {
                if (link) {
                    link.setAttribute('href', `${basePath}${pagesPath}about.html`);
                    console.log('About link set to:', `${basePath}${pagesPath}about.html`);
                }
            });
            
            // Update services links
            navLinks.services.forEach(link => {
                if (link) {
                    link.setAttribute('href', `${basePath}${pagesPath}services.html`);
                    console.log('Services link set to:', `${basePath}${pagesPath}services.html`);
                }
            });
            
            // Update contact links
            navLinks.contact.forEach(link => {
                if (link) {
                    link.setAttribute('href', `${basePath}${pagesPath}contact.html`);
                    console.log('Contact link set to:', `${basePath}${pagesPath}contact.html`);
                }
            });
            
            // Special fix for pages directory links within the pages directory
            if (inPagesDir) {
                // Fix all other anchor tags that might point to pages/ incorrectly
                document.querySelectorAll('a[href^="pages/"]').forEach(link => {
                    const href = link.getAttribute('href');
                    // Extract just the filename from pages/filename.html
                    const fileName = href.split('/').pop();
                    if (fileName) {
                        link.setAttribute('href', fileName);
                        console.log('Fixed link from', href, 'to', fileName);
                    }
                });
            }
        }
    })();
</script>
